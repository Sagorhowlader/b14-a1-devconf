<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevConf2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!--nav section  -->
    <header class="header-container">
      <nav class="nav-container">
        <div>
          <img class="logo-min-image" src="./assets/logo.png" alt="logo-mini" />
        </div>
        <div class="nav-menu">
          <ul class="nav-link common-font">
            <li><a href="#">Speakers</a></li>
            <li><a href="#">Schedule</a></li>
            <li><a href="#">Tracks</a></li>
            <li><a href="#">Venue </a></li>
            <li><a href="#">Blog</a></li>
          </ul>
        </div>
        <div>
          <button class="blue-btn common-font nav-register-btn">
            Register Now
          </button>
        </div>
      </nav>
    </header>
    <!-- main section start -->
    <main>
      <!-- hero section  -->
      <section class="hero">
        <div class="hero-container header-container">
          <div class="hero-container-text common-font">
            <h1>Code. <i>Connect.</i> Create</h1>
            <p>
              Join 4,000+ engineers, founders, and builders at the premier
              developer conference of 2026. Three days of cutting-edge talks,
              hands-on workshops, and meaningful connections.
            </p>
          </div>
          <div class="hero-btn-container">
            <button class="blue-btn hero-btn">Register Now</button>
          </div>
        </div>
      </section>
      <!-- hero section end -->
    </main>
  </body>
</html>
